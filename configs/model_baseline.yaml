# Model + data are both selected by the same `model.name` string
# via data_factory / model_factory registries.
#
# Available model.name values:
#   baseline        — LSTM encoder + dual heads; memmap .npy tensor cache
#   baseline_binary — same LSTM; flat binary file + index CSV
#   transformer     — Transformer encoder + CLS + dual heads; same memmap cache
#
# Transformer-only knobs (ignored by LSTM): n_layers, n_heads, dropout

model:
  name: baseline          # registry key → dataset form + network
  tag: lstm               # unique run ID → checkpoints/lstm_best_model.pt
  num_agents: 7           # ego + 6 neighbor slots
  num_features: 4         # e.g. dx, dy, heading_rel, speed
  hidden_dim: 64          # LSTM hidden / Transformer d_model
  num_frames: 80          # 10 fps × 8 s history
  # n_layers: 2           # Transformer encoder layers
  # n_heads: 4            # Transformer attention heads
  # dropout: 0.1          # Transformer dropout

data:
  data_train: data/processed/train       # prefix for {train}_x.npy or {train}_data.bin
  label_train: data/processed/labels/events_labels_train.csv
  data_val: data/processed/val
  label_val: data/processed/labels/events_labels_val.csv
  # future traj is optional for this classification baseline
  # future_train: data/processed/labels/events_future_traj_train.csv
  # future_val: data/processed/labels/events_future_traj_val.csv

train:
  batch_size: 32
  num_workers: 0
  lr: 1.0e-3
  max_epochs: 20
  seed: 42
  device: cuda             # cpu | cuda

eval:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
