# Held-out data processing pipeline config.
# Processes held-out locations (freewayD + one intersection) as test-only.
# Same conflict detection / neighbor / rebalance settings as the other
# pipelines, but all events are exported to the test split (no train/val).

time:
  history_sec: 8.0
  future_sec: 3.0
  fps: 10.0
  conflict_ttc_threshold: 1.5

neighbor:
  max_distance_m: 200.0
  slots:
    - front
    - rear
    - left_front
    - left_rear
    - right_front
    - right_rear

io:
  raw_dir: data/raw_heldout
  interim_dir: data/interim/candidates
  event_id_offset: 10000000  # held-out events get IDs from 10M so they never collide with normal data
  data_out: data/processed/data/events_data_heldout.csv
  label_out: data/processed/labels/events_labels_heldout.csv
  future_traj_out: data/processed/labels/events_future_traj_heldout.csv

split:
  test_only: true

rebalance:
  enabled: true
  target_ratio: 1.0
  balance_conflict_types: false
  per_scene: true
  seed: 42
