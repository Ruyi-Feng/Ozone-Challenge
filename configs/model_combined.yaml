# Transformer conflict model — combined dataset (highway + intersection).
# Same architecture as model_transformer.yaml, pointing to combined tensor cache.

model:
  name: transformer
  num_agents: 7
  num_features: 4
  hidden_dim: 64
  num_frames: 80
  n_layers: 2
  n_heads: 4
  dropout: 0.1

data:
  data_train: data/processed/combined_train
  label_train: data/processed/labels/events_labels_combined_train.csv
  data_val: data/processed/combined_val
  label_val: data/processed/labels/events_labels_combined_val.csv

train:
  batch_size: 32
  num_workers: 0
  lr: 1.0e-3
  max_epochs: 20
  seed: 42
  device: cuda

eval:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
